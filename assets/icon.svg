<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="120" y1="120" x2="904" y2="904" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="g2" x1="904" y1="120" x2="120" y2="904" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="g3" x1="512" y1="120" x2="512" y2="904" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="64" y="64" width="896" height="896" rx="196" fill="#0f0f1a"/>
  
  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#a0a0ff" stroke-width="1">
    <line x1="64" y1="256" x2="960" y2="256"/><line x1="64" y1="512" x2="960" y2="512"/><line x1="64" y1="768" x2="960" y2="768"/>
    <line x1="256" y1="64" x2="256" y2="960"/><line x1="512" y1="64" x2="512" y2="960"/><line x1="768" y1="64" x2="768" y2="960"/>
  </g>
  
  <!-- Three geometric panels (Nova explosion) -->
  <path d="M512 180 L280 460 L180 660 L512 820 L844 660 L744 460 Z" fill="url(#g1)" opacity="0.12"/>
  <path d="M512 260 L360 480 L300 620 L512 740 L724 620 L664 480 Z" fill="url(#g2)" opacity="0.18"/>
  <path d="M512 340 L420 500 L380 590 L512 670 L644 590 L604 500 Z" fill="url(#g3)" opacity="0.25"/>
  
  <!-- Central node (core) -->
  <circle cx="512" cy="512" r="48" fill="url(#g1)" filter="url(#glow)"/>
  <circle cx="512" cy="512" r="24" fill="#f0f0ff" opacity="0.9"/>
  
  <!-- Orbiting nodes -->
  <circle cx="340" cy="460" r="12" fill="url(#g1)" filter="url(#glow)" opacity="0.7"/>
  <circle cx="684" cy="460" r="12" fill="url(#g2)" filter="url(#glow)" opacity="0.7"/>
  <circle cx="512" cy="300" r="10" fill="url(#g3)" filter="url(#glow)" opacity="0.6"/>
  <circle cx="512" cy="724" r="10" fill="url(#g1)" filter="url(#glow)" opacity="0.6"/>
  <circle cx="260" cy="620" r="8" fill="url(#g2)" filter="url(#glow)" opacity="0.5"/>
  <circle cx="764" cy="620" r="8" fill="url(#g3)" filter="url(#glow)" opacity="0.5"/>
  
  <!-- Connection lines -->
  <g stroke="url(#g1)" stroke-width="1.5" opacity="0.2">
    <line x1="340" y1="460" x2="512" y2="512"/>
    <line x1="684" y1="460" x2="512" y2="512"/>
    <line x1="340" y1="460" x2="260" y2="620"/>
    <line x1="684" y1="460" x2="764" y2="620"/>
    <line x1="512" y1="300" x2="512" y2="512"/>
    <line x1="512" y1="724" x2="512" y2="512"/>
  </g>
</svg>